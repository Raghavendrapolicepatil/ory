```html
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forgot Password | Orymart</title>

<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/forgot-password.css">

<link
    href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css"
    rel="stylesheet">

</head>

<body>

<div class="app">

    <div class="forgot-container">

        <!-- Back -->

        <a href="login.html" class="back-btn">

            <i class="ri-arrow-left-line"></i>

        </a>


        <!-- Logo -->

        <div class="forgot-logo">

            <img
                src="assets/icons/icon-512.png"
                alt="Orymart">

            <h1>Forgot Password</h1>

            <p>
                Enter your registered mobile number
                to reset your password.
            </p>

        </div>


        <!-- Forgot Password Form -->

        <form id="forgotForm">

            <!-- Phone -->

            <div class="input-box">

                <i class="ri-phone-line"></i>

                <input
                    type="tel"
                    id="phone"
                    placeholder="Mobile Number"
                    maxlength="10"
                    inputmode="numeric"
                    autocomplete="tel"
                    required>

            </div>


            <!-- Send OTP -->

            <button
                type="submit"
                class="forgot-btn"
                id="sendOtpBtn">

                Send OTP

            </button>


            <!-- OTP + Password Section -->

            <div
                id="otpSection"
                style="display: none;">

                <!-- OTP -->

                <div class="input-box">

                    <i class="ri-shield-keyhole-line"></i>

                    <input
                        type="text"
                        id="otp"
                        placeholder="Enter 4-digit OTP"
                        maxlength="4"
                        inputmode="numeric"
                        autocomplete="one-time-code">

                </div>


                <!-- New Password -->

                <div class="input-box">

                    <i class="ri-lock-line"></i>

                    <input
                        type="password"
                        id="newPassword"
                        placeholder="New Password"
                        autocomplete="new-password">

                </div>


                <!-- Confirm Password -->

                <div class="input-box">

                    <i class="ri-lock-password-line"></i>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm New Password"
                        autocomplete="new-password">

                </div>


                <!-- Reset Password -->

                <button
                    type="button"
                    class="forgot-btn"
                    id="resetPasswordBtn">

                    Reset Password

                </button>

            </div>

        </form>


        <!-- Login -->

        <div class="bottom-link">

            Remember your password?

            <a href="login.html">
                Login
            </a>

        </div>

    </div>

</div>


<script src="assets/js/forgot-password.js"></script>
<script src="assets/js/theme.js"></script>

</body>

</html>
```

**Ab login HTML bhejne ki zarurat nahi hai.** Iske baad hum `forgot-password.js` aur backend ke **2 OTP endpoints** ko match karenge.
