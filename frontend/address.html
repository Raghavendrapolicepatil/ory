<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Saved Addresses | Orymart</title>

    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/address.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="app">

    <!-- ==========================
         Header
    =========================== -->

    <header class="address-header">

        <a href="profile.html" class="back-btn">

            <i class="fa-solid fa-arrow-left"></i>

        </a>

        <div class="header-title">

            <h2>Saved Addresses</h2>

            <p>Choose where you want your order</p>

        </div>

    </header>


    <!-- ==========================
         Address List
    =========================== -->

    <main id="address-list">

    </main>


    <!-- ==========================
         Add Address Button
    =========================== -->

    <button
        id="add-address-btn"
        class="add-address-btn">

        <i class="fa-solid fa-plus"></i>

        Add New Address

    </button>

</div>


<!-- ==========================
     Address Popup
=========================== -->

<div
    class="address-popup"
    id="address-popup">

    <div class="popup-content">

        <!-- Header -->

        <div class="popup-header">

            <div>

                <h2 id="popup-title">
                    Add New Address
                </h2>

                <p>
                    Enter your delivery details
                </p>

            </div>

            <button
                type="button"
                id="close-popup"
                class="close-popup">

                <i class="fa-solid fa-xmark"></i>

            </button>

        </div>


        <!-- ==========================
             Current Location
        =========================== -->

        <button
            type="button"
            id="current-location-btn"
            class="current-location-btn">

            <i class="fa-solid fa-location-crosshairs"></i>

            <span>Use Current Location</span>

        </button>

        <p
            id="location-status"
            class="location-status">
        </p>


        <!-- ==========================
             Address Form
        =========================== -->

        <form id="address-form">

            <div class="address-type">

                <button
                    type="button"
                    class="type-btn active"
                    data-type="Home">

                    <i class="fa-solid fa-house"></i>
                    Home

                </button>

                <button
                    type="button"
                    class="type-btn"
                    data-type="Work">

                    <i class="fa-solid fa-briefcase"></i>
                    Work

                </button>

                <button
                    type="button"
                    class="type-btn"
                    data-type="Other">

                    <i class="fa-solid fa-location-dot"></i>
                    Other

                </button>

            </div>


            <!-- Name -->

            <label>
                Full Name
            </label>

            <input
                type="text"
                id="full-name"
                placeholder="Enter full name"
                required>


            <!-- Mobile -->

            <label>
                Mobile Number
            </label>

            <input
                type="tel"
                id="mobile"
                placeholder="10-digit mobile number"
                maxlength="10"
                inputmode="numeric"
                required>


            <!-- House -->

            <label>
                House / Flat
            </label>

            <input
                type="text"
                id="house"
                placeholder="House No / Flat / Building"
                required>


            <!-- Street -->

            <label>
                Area / Street
            </label>

            <input
                type="text"
                id="street"
                placeholder="Area / Street / Landmark"
                required>


            <!-- City -->

            <label>
                City
            </label>

            <input
                type="text"
                id="city"
                value="Afzalpur"
                required>


            <!-- Pincode -->

            <label>
                Pincode
            </label>

            <input
                type="tel"
                id="pincode"
                placeholder="6-digit pincode"
                maxlength="6"
               value="585301"
                required>


            <!-- Location information -->

            <div
                id="location-info"
                class="location-info hidden">

                <i class="fa-solid fa-location-dot"></i>

                <span>
                    Current location detected
                </span>

            </div>


            <!-- Save -->

            <button
                type="submit"
                class="save-address"
                id="save-address-btn">

                <i class="fa-solid fa-check"></i>

                Save Address

            </button>

        </form>

    </div>

</div>


<script src="assets/js/address.js"></script>
<script src="assets/js/theme.js"></script>

</body>

</html>
