<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>My Account | Orymart</title>

    <link
        rel="stylesheet"
        href="assets/css/style.css">

    <link
        rel="stylesheet"
        href="assets/css/profile.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="app">

    <!-- ==========================================
         HEADER
    ========================================== -->

    <header class="profile-header">

        <a
            href="index.html"
            class="back-btn">

            <i class="fa-solid fa-arrow-left"></i>

        </a>

        <h2>My Account</h2>

        <span></span>

    </header>


    <!-- ==========================================
         GUEST USER
    ========================================== -->

    <section
        class="profile-card guest-profile"
        id="guestProfile">

        <div class="profile-image">

            <i class="fa-solid fa-user"></i>

        </div>

        <h2>Welcome to Orymart</h2>

        <p>Login to access your account</p>

        <button
            type="button"
            class="edit-btn"
            id="loginBtn">

            Login with OTP

        </button>

    </section>


    <!-- ==========================================
         LOGGED IN USER
    ========================================== -->

    <section
        class="profile-card user-profile"
        id="userProfile"
        style="display:none;">

        <div class="profile-image">

            <i class="fa-solid fa-user"></i>

        </div>

        <h2 id="userName">
            Orymart User
        </h2>

        <p id="userPhone">
            +91 XXXXXXXXXX
        </p>

        <button
            type="button"
            class="edit-btn"
            id="editProfileBtn">

            Edit Profile

        </button>

    </section>


    <!-- ==========================================
         ACCOUNT MENU
    ========================================== -->

    <section class="profile-menu">


        <!-- My Orders -->

        <a
            href="orders.html"
            class="menu-item">

            <i class="fa-solid fa-box"></i>

            <span>My Orders</span>

            <i class="fa-solid fa-angle-right"></i>

        </a>


        <!-- Addresses -->

        <a
            href="address.html"
            class="menu-item">

            <i class="fa-solid fa-location-dot"></i>

            <span>Saved Addresses</span>

            <i class="fa-solid fa-angle-right"></i>

        </a>


        <!-- Wishlist -->

        <a
            href="wishlist.html"
            class="menu-item">

            <i class="fa-solid fa-heart"></i>

            <span>Wishlist</span>

            <i class="fa-solid fa-angle-right"></i>

        </a>


        <!-- Payment -->

        <a
            href="payment-method.html"
            class="menu-item">

            <i class="fa-solid fa-credit-card"></i>

            <span>Payment Methods</span>

            <i class="fa-solid fa-angle-right"></i>

        </a>


        <!-- Coupons -->

        <a
            href="coupons.html"
            class="menu-item">

            <i class="fa-solid fa-tag"></i>

            <span>Offers & Coupons</span>

            <i class="fa-solid fa-angle-right"></i>

        </a>


        <!-- Help -->

        <a
            href="help.html"
            class="menu-item">

            <i class="fa-solid fa-headset"></i>

            <span>Help & Support</span>

            <i class="fa-solid fa-angle-right"></i>

        </a>


        <!-- Settings -->

        <a
            href="settings.html"
            class="menu-item">

            <i class="fa-solid fa-gear"></i>

            <span>Settings</span>

            <i class="fa-solid fa-angle-right"></i>

        </a>


        <!-- About -->

        <a
            href="about.html"
            class="menu-item">

            <i class="fa-solid fa-circle-info"></i>

            <span>About Orymart</span>

            <i class="fa-solid fa-angle-right"></i>

        </a>


        <!-- Privacy -->

        <a
            href="privacy.html"
            class="menu-item">

            <i class="fa-solid fa-shield-halved"></i>

            <span>Privacy Policy</span>

            <i class="fa-solid fa-angle-right"></i>

        </a>


        <!-- Terms -->

        <a
            href="terms.html"
            class="menu-item">

            <i class="fa-solid fa-file-contract"></i>

            <span>Terms & Conditions</span>

            <i class="fa-solid fa-angle-right"></i>

        </a>


        <!-- Login / Logout -->

        <a
            href="login.html"
            class="menu-item logout"
            id="authBtn">

            <i
                class="fa-solid fa-right-from-bracket"
                id="authIcon"></i>

            <span id="authText">
                Login with OTP
            </span>

            <i class="fa-solid fa-angle-right"></i>

        </a>

    </section>

</div>


<script src="assets/js/profile.js"></script>

<script src="assets/js/theme.js"></script>

</body>

</html>
