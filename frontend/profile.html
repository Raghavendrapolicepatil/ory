<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile | OryMart</title>

    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/profile.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="app">

    <!-- Header -->

    <header class="profile-header">

        <a href="index.html" class="back-btn">

            <i class="fa-solid fa-arrow-left"></i>

        </a>

        <h2>My Account</h2>

        <span></span>

    </header>

    <!-- User -->

    <section class="profile-card">

        <div class="profile-image">

            <i class="fa-solid fa-user"></i>

        </div>

        <h2>Enter Name</h2>

        <p>Enter Number</p>

        <button class="edit-btn">

            Edit Profile

        </button>

    </section>

    <!-- Menu -->

    <section class="profile-menu">

        <a href="orders.html" class="menu-item">

            <i class="fa-solid fa-box"></i>

            <span>My Orders</span>

            <i class="fa-solid fa-angle-right"></i>

        </a>

        <a href="address.html" class="menu-item">

             <i class="fa-solid fa-location-dot"></i>

             <span>Saved Addresses</span>

            <i class="fa-solid fa-angle-right"></i>
        
        </a>

        <a href="wishlist.html" class="menu-item">

            <i class="fa-solid fa-heart"></i>

            <span>Wishlist</span>

            <i class="fa-solid fa-angle-right"></i>

        </a>

        <a href="#" class="menu-item">

            <i class="fa-solid fa-credit-card"></i>

            <span>Payment Methods</span>

            <i class="fa-solid fa-angle-right"></i>

        </a>

        <a href="#" class="menu-item">

            <i class="fa-solid fa-tag"></i>

            <span>Offers & Coupons</span>

            <i class="fa-solid fa-angle-right"></i>

        </a>

        <a href="help.html" class="menu-item">

            <i class="fa-solid fa-headset"></i>

            <span>Help & Support</span>

            <i class="fa-solid fa-angle-right"></i>

        </a>
    
        <a href="settings.html" class="menu-item">

            <i class="fa-solid fa-gear"></i>

            <span>Settings</span>

            <i class="fa-solid fa-angle-right"></i>

        </a>

        <a href="about.html" class="menu-item">

            <i class="fa-solid fa-circle-info"></i>

            <span>About ORY Mart</span>

            <i class="fa-solid fa-angle-right"></i>

        </a>

        <a href="login.html" class="menu-item logout">

            <i class="fa-solid fa-right-from-bracket"></i>

            <span>Logout</span>

            <i class="fa-solid fa-angle-right"></i>

        </a>

    </section>

</div>

<script src="assets/js/profile.js"></script>
<script src="assets/js/theme.js"></script>
