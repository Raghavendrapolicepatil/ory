<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Coupons | Orymart</title>

    <link
        rel="stylesheet"
        href="assets/css/style.css">

    <link
        rel="stylesheet"
        href="assets/css/coupons.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="coupons-page">

    <!-- Header -->

  
    <header class="orders-header">

        <button
            class="back-btn"
            onclick="history.back()">

            <i class="fa-solid fa-arrow-left"></i>

        </button>

        <div class="header-title">

            <h2> Coupons </h2>

            <p>Save more on your orders</p>

        </div>

    </header>
    </header>


    <!-- Coupons -->

    <main class="coming-soon-box">

    <div class="coming-icon">

        <i class="fa-solid fa-ticket"></i>

    </div>

    <h1>Coupons Coming Soon</h1>

    <p>
        Exciting offers and discount coupons
        will be available soon on Orymart.
    </p>

    <div class="coming-note">

        <i class="fa-solid fa-bullhorn"></i>

        Stay tuned for amazing deals!

    </div>

    <a
        href="index.html"
        class="shop-btn">

        Continue Shopping

    </a>

</main>

</div>


<div id="coupon-toast" class="coupon-toast"></div>


<script src="assets/js/coupons.js"></script>
<script src="assets/js/theme.js"></script>

</body>

</html>
