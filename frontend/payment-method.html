<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Payment Method | Orymart</title>

    <link
        rel="stylesheet"
        href="assets/css/style.css">

    <link
        rel="stylesheet"
        href="assets/css/payment-method.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="payment-page">

    <header class="payment-header">

        <a
            href="profile.html"
            class="back-btn">

            <i class="fa-solid fa-arrow-left"></i>

        </a>

        <h2>Payment Method</h2>

    </header>


    <main class="coming-soon-box">

        <div class="coming-icon">

            <i class="fa-solid fa-wallet"></i>

        </div>

        <h1>Coming Soon</h1>

        <p>
            Online payment methods are currently
            being prepared for Orymart.
        </p>

        <div class="payment-list">

            <div>
                <i class="fa-solid fa-mobile-screen-button"></i>
                UPI
            </div>

            <div>
                <i class="fa-solid fa-credit-card"></i>
                Credit / Debit Card
            </div>

            <div>
                <i class="fa-solid fa-building-columns"></i>
                Net Banking
            </div>

        </div>

        <p class="available-text">

            <i class="fa-solid fa-circle-check"></i>

            Cash on Delivery is currently available.

        </p>

        <a
            href="index.html"
            class="shop-btn">

            Continue Shopping

        </a>

    </main>

</div>

<script src="assets/js/theme.js"></script>

</body>

</html>
