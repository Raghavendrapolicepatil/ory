<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Success | Snackible</title>

    <link rel="stylesheet" href="assets/css/style.css">

    <link rel="stylesheet" href="assets/css/order-success.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <div class="success-container">

        <div class="success-card">

            <div class="success-icon">

                <i class="fa-solid fa-check"></i>

            </div>

            <h2>Order Placed Successfully 🎉</h2>

            <p>

                Thank you for shopping with Snackible.

                Your order has been placed successfully.

            </p>

            <div class="order-id">

                Order ID :
                <span id="order-id"></span>

            </div>

            <div class="success-buttons">

                <button
                    class="btn primary-btn"
                    onclick="window.location.href='index.html'">

                    Continue Shopping

                </button>

                <button
                    class="btn secondary-btn"
                    onclick="window.location.href='orders.html'">

                    View Orders

                </button>

            </div>

        </div>

    </div>

    <script src="assets/js/order-success.js"></script>
    <script src="assets/js/theme.js"></script>

</body>

</html>
