<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | Orymart</title>

<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/login.css">

<link
    href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css"
    rel="stylesheet">

</head>

<body>

<div class="app">

<div class="login-container">

<div class="login-logo">

<img
    src="assets/icons/icon-512.png"
    alt="Orymart">

<h1>Welcome to Orymart</h1>

<p>Login or create your account with mobile number</p>

</div>


<form id="loginForm">

<!-- ==========================================
     MOBILE NUMBER
========================================== -->

<div
    class="input-box"
    id="phoneBox">

<i class="ri-phone-line"></i>

<input
    type="tel"
    id="login"
    placeholder="Mobile Number"
    maxlength="10"
    inputmode="numeric"
    autocomplete="tel"
    required>

</div>


<!-- ==========================================
     CONTINUE
========================================== -->

<button
    type="submit"
    class="login-btn"
    id="sendOtpBtn">

Continue

</button>


<!-- ==========================================
     OTP SECTION
========================================== -->

<div
    id="otpSection"
    style="display:none;">

<div class="otp-title">

<h3>Enter OTP</h3>

<p>
We sent a 4-digit OTP to your mobile number
</p>

</div>


<div
    class="input-box"
    id="otpBox">

<i class="ri-shield-keyhole-line"></i>

<input
    type="text"
    id="otp"
    placeholder="Enter OTP"
    maxlength="4"
    inputmode="numeric"
    autocomplete="one-time-code"
    pattern="[0-9]*">

</div>


<button
    type="button"
    class="login-btn"
    id="verifyOtpBtn">

Verify

</button>


<button
    type="button"
    class="resend-btn"
    id="resendOtpBtn">

Resend OTP

</button>

</div>

</form>


<!-- ==========================================
     SKIP
========================================== -->

<div class="login-links">

<a
    href="index.html"
    class="skip-link">

Skip for now

</a>

</div>


</div>

</div>


<script src="assets/js/login.js"></script>
<script src="assets/js/theme.js"></script>

</body>

</html>
