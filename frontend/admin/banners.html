<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Banners | Snackible Admin</title>

<link rel="stylesheet" href="../assets/css/admin-layout.css">
<link rel="stylesheet" href="../assets/css/admin-banners.css">

<link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet">

</head>

<body>

<div class="admin">

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="logo">

            Snackible

        </div>

        <ul class="menu">

            <li>
                <a href="dashboard.html">
                    <i class="ri-dashboard-line"></i>
                    Dashboard
                </a>
            </li>

            <li>
                <a href="products.html">
                    <i class="ri-shopping-bag-line"></i>
                    Products
                </a>
            </li>

            <li>
                <a href="categories.html">
                    <i class="ri-layout-grid-line"></i>
                    Categories
                </a>
            </li>

            <li>
                <a href="orders.html">
                    <i class="ri-file-list-3-line"></i>
                    Orders
                </a>
            </li>

             <li>
                <a href="print-orders.html">
                    <i class="ri-printer-line"></i>
                    Print Orders
                </a>
            </li>

            <li>
                <a href="users.html">
                    <i class="ri-user-3-line"></i>
                    Users
                </a>
            </li>

            <li>
                <a class="active" href="banners.html">
                    <i class="ri-image-line"></i>
                    Banners
                </a>
            </li>

            <li>
                <a href="settings.html">
                    <i class="ri-settings-3-line"></i>
                    Settings
                </a>
            </li>

        </ul>

    </aside>

    <!-- Main Content -->

    <main class="content">

        <div class="topbar">

            <h2>

                <i class="ri-image-line"></i>

                Banner Management

            </h2>

        </div>

        <!-- Banner Form -->

        <form id="bannerForm">

    <div class="form-grid">

        <input
            type="text"
            id="title"
            placeholder="Banner Title"
            required>

        <input
            type="text"
            id="subtitle"
            placeholder="Banner Subtitle">

        <input
            type="text"
            id="image"
            placeholder="assets/images/banners/banner-1.webp"
            required>

        <input
            type="text"
            id="link"
            placeholder="Banner Link (Optional)">

        <input
            type="number"
            id="order"
            placeholder="Display Order"
            value="1"
            min="1">

        <select id="status">

            <option value="true">
                Active
            </option>

            <option value="false">
                Inactive
            </option>

        </select>

    </div>

    <button type="submit" class="save-btn">

        <i class="ri-save-line"></i>

        Save Banner

    </button>

</form>
        <!-- Banner List -->

        <div id="bannerList">

        </div>

    </main>

</div>

<script src="../assets/js/admin-banners.js"></script>

</body>

</html>
