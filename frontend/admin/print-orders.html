<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Print Orders | Snackible Admin</title>

<link rel="stylesheet" href="../assets/css/admin-layout.css">
<link rel="stylesheet" href="../assets/css/admin-print-orders.css">

<link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet">

</head>

<body>

<div class="admin">

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="logo">

            Ory Mart

        </div>

        <ul class="menu">

            <li>
                <a href="dashboard.html">
                    <i class="ri-dashboard-line"></i>
                    Dashboard
                </a>
            </li>

            <li>
                <a href="products.html">
                    <i class="ri-shopping-bag-line"></i>
                    Products
                </a>
            </li>

            <li>
                <a href="categories.html">
                    <i class="ri-layout-grid-line"></i>
                    Categories
                </a>
            </li>

            <li>
                <a href="orders.html">
                    <i class="ri-file-list-3-line"></i>
                    Grocery Orders
                </a>
            </li>

            <li>
                <a class="active" href="print-orders.html">
                    <i class="ri-printer-line"></i>
                    Print Orders
                </a>
            </li>

            <li>
                <a href="users.html">
                    <i class="ri-user-3-line"></i>
                    Users
                </a>
            </li>

            <li>
                <a href="banners.html">
                    <i class="ri-image-line"></i>
                    Banners
                </a>
            </li>

            <li>
                <a href="settings.html">
                    <i class="ri-settings-3-line"></i>
                    Settings
                </a>
            </li>

        </ul>

    </aside>

    <!-- Content -->

    <main class="content">

        <div class="topbar">

            <h2>

                <i class="ri-printer-line"></i>

                Print Orders

            </h2>

        </div>

        <!-- Toolbar -->

        <div class="orders-toolbar">

            <input
                type="text"
                id="searchPrintOrder"
                placeholder="🔍 Search Customer">

            <select id="statusFilter">

                <option value="">All Status</option>

                <option value="Pending">Pending</option>

                <option value="Printing">Printing</option>

                <option value="Ready">Ready</option>

                <option value="Completed">Completed</option>

                <option value="Cancelled">Cancelled</option>

            </select>

        </div>

        <!-- Table -->

        <section class="orders-section">

            <table class="orders-table">

                <thead>

                    <tr>

                        <th>Order ID</th>

                        <th>Customer</th>

                        <th>Files</th>

                        <th>Pages</th>

                        <th>Total</th>

                        <th>Payment</th>

                        <th>Status</th>

                        <th>Date</th>

                        <th>Action</th>

                    </tr>

                </thead>

                <tbody id="printOrdersTable">

                    <tr>

                        <td colspan="9">

                            Loading Print Orders...

                        </td>

                    </tr>

                </tbody>

            </table>

        </section>

        <!-- Modal -->

        <div id="printOrderModal" class="modal">

            <div class="modal-content">

                <span class="close" onclick="closeModal()">

                    &times;

                </span>

                <h2>

                    Print Order Details

                </h2>

                <div id="printOrderDetails">

                </div>

            </div>

        </div>

    </main>

</div>

<script src="../assets/js/admin-print-orders.js"></script>

</body>

</html>
