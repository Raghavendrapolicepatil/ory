<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Print Documents | OryMart</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/print.css">

</head>

<body>

    <!-- =========================
         HEADER
    ========================== -->

    <header class="topbar">

        <button type="button" class="back-btn" onclick="history.back()">
            <i class="ri-arrow-left-line"></i>
        </button>

        <h2>Print Documents</h2>

    </header>

    <!-- =========================
         MAIN
    ========================== -->

    <main class="container">

        <!-- Upload -->

        <section class="card">

            <div class="upload-box">

                <i class="ri-upload-cloud-2-line"></i>

                <h3>Upload PDF / Image</h3>

                <p>Supported: PDF, JPG, PNG</p>

                <input
                    type="file"
                    id="fileInput"
                    accept=".pdf,.jpg,.jpeg,.png">

            </div>

            <div class="file-info" id="fileInfo">

                <p id="fileName">No file selected</p>

                <p id="pageCount">Pages : 0</p>

            </div>

            <div id="previewContainer" class="preview-container"></div>

        </section>

        <!-- Paper Size -->

        <section class="card">

            <h3>Paper Size</h3>

            <div class="option active">
                A4 Sheet
            </div>

        </section>

        <!-- Print Type -->

        <section class="card">

            <h3>Print Type</h3>

            <label class="radio">
                <input
                    type="radio"
                    name="type"
                    value="bw"
                    checked>
                Black & White
            </label>

            <label class="radio">
                <input
                    type="radio"
                    name="type"
                    value="colour">
                Colour
            </label>

        </section>

        <!-- Print Side -->

        <section class="card">

            <h3>Print Side</h3>

            <label class="radio">
                <input
                    type="radio"
                    name="side"
                    value="single"
                    checked>
                Single Side
            </label>

            <label class="radio">
                <input
                    type="radio"
                    name="side"
                    value="double">
                Double Side
            </label>

        </section>

        <!-- Copies -->

        <section class="card">

            <h3>Copies</h3>

            <div class="qty">

                <button type="button" id="minusBtn">−</button>

                <span id="copyCount">1</span>

                <button type="button" id="plusBtn">+</button>

            </div>

        </section>

        <!-- Total -->

        <section class="card total-card">

            <div>

                <h3>Total</h3>

                <p>Estimated Price</p>

            </div>

            <h2 id="totalPrice">₹0</h2>

        </section>

    </main>

    <!-- =========================
         FOOTER
    ========================== -->

    <footer class="bottom">

        <button class="order-btn" id="addToCartBtn">

            <i class="ri-shopping-cart-line"></i>

            Add to Cart

        </button>

    </footer>

    <!-- PDF.js -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.5.136/pdf.min.js"></script>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc =
            "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.5.136/pdf.worker.min.js";
    </script>

    <!-- Print JS -->

    <script src="assets/js/print.js"></script>

</body>

</html>
