<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Print Documents</title>

    <!-- Font Awesome -->

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- CSS -->

    <link rel="stylesheet" href="css/print.css">

</head>

<body>

<main class="print-page">

    <!-- =========================
            Header
    ========================== -->

    <section class="print-header">

        <button class="back-btn">
            <i class="fa-solid fa-arrow-left"></i>
        </button>

        <div class="header-content">
            <h1>Print Documents</h1>
            <p>PDF • Images • Fast Printing</p>
        </div>

    </section>


    <!-- =========================
            Upload Files
    ========================== -->

    <section class="upload-section">

        <label for="fileInput" class="upload-box">

            <div class="upload-icon">
                <i class="fa-solid fa-cloud-arrow-up"></i>
            </div>

            <h2>Upload Files</h2>

            <p>
                Tap here to upload PDF, JPG, PNG or WEBP
            </p>

            <input
                type="file"
                id="fileInput"
                hidden
                multiple
                accept=".pdf,.jpg,.jpeg,.png,.webp">

        </label>

    </section>

</main>
<!-- =========================
        Preview Section
========================== -->

<section class="preview-section">

    <div class="section-title">
        <h2>Preview</h2>

        <div class="page-navigation">

            <button id="prevPage" class="nav-btn">
                <i class="fa-solid fa-angle-left"></i>
            </button>

            <span id="pageIndicator">
                Page 1 / 1
            </span>

            <button id="nextPage" class="nav-btn">
                <i class="fa-solid fa-angle-right"></i>
            </button>

        </div>
    </div>


    <div class="preview-box" id="previewBox">

        <div class="empty-preview">

            <i class="fa-regular fa-file-lines"></i>

            <p>Select a file to preview</p>

        </div>

    </div>

</section>



<!-- =========================
        Uploaded Files
========================== -->

<section class="uploaded-files-section">

    <div class="section-title">

        <h2>Uploaded Files</h2>

        <span id="fileCount">
            0 Files
        </span>

    </div>


    <div class="uploaded-files-list" id="uploadedFilesList">

        <!-- Example File -->

        <!--
        <div class="uploaded-file active">

            <div class="file-left">

                <i class="fa-regular fa-file-pdf"></i>

                <div>

                    <h4>Notes.pdf</h4>

                    <p>5 Pages</p>

                </div>

            </div>

        </div>
        -->

    </div>

</section>
<!-- =========================
        Print Options
========================== -->

<section class="print-options">

    <!-- Paper Size -->

    <div class="option-card">

        <h3>Paper Size</h3>

        <div class="option-chips" id="paperSize">

            <button class="chip active" data-size="A4">
                A4
            </button>

            <button class="chip" data-size="A3">
                A3
            </button>

            <button class="chip" data-size="A5">
                A5
            </button>

        </div>

    </div>


    <!-- Print Type -->

    <div class="option-card">

        <h3>Print Type</h3>

        <div class="option-chips" id="printType">

            <button class="chip active" data-type="bw">
                <i class="fa-solid fa-print"></i>
                B&W
            </button>

            <button class="chip" data-type="colour">
                <i class="fa-solid fa-palette"></i>
                Colour
            </button>

        </div>

    </div>


    <!-- Print Side -->

    <div class="option-card">

        <h3>Print Side</h3>

        <div class="option-chips" id="printSide">

            <button class="chip active" data-side="single">
                Single
            </button>

            <button class="chip" data-side="double">
                Front & Back
            </button>

        </div>

    </div>


    <!-- Copies -->

    <div class="option-card">

        <h3>Copies</h3>

        <div class="copies-box">

            <button id="decreaseCopies">
                <i class="fa-solid fa-minus"></i>
            </button>

            <span id="copiesCount">
                1
            </span>

            <button id="increaseCopies">
                <i class="fa-solid fa-plus"></i>
            </button>

        </div>

    </div>

</section>

<!-- =========================
        Sticky Bottom Bar
========================== -->

<div class="bottom-cart">

    <div class="cart-details">

        <div class="pages-info">

            <span id="bottomPages">
                0 Pages
            </span>

            <small id="bottomSheets">
                0 Sheets
            </small>

        </div>

        <div class="price-info">

            <strong id="bottomPrice">
                ₹0
            </strong>

        </div>

    </div>

    <button id="addToCartBtn" class="add-cart-btn">

        <i class="fa-solid fa-cart-shopping"></i>

        Add to Cart

    </button>

</div>

    <script src="js/print.js"></script>

</body>

</html>
