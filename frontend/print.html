<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Print Documents | OryMart</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet">

<link rel="stylesheet" href="assets/css/print.css">

</head>

<body>

<header class="topbar">

    <button onclick="history.back()">
        <i class="ri-arrow-left-line"></i>
    </button>

    <h2>Print Documents</h2>

</header>

<main class="container">

    <!-- Upload -->

    <section class="card">

        <div class="upload-box">

            <i class="ri-upload-cloud-2-line"></i>

            <h3>Upload PDF / Image</h3>

            <p>Supported: PDF, JPG, PNG</p>

            <input type="file"
                   id="fileInput"
                   accept=".pdf,.jpg,.jpeg,.png">

        </div>

    </section>

    <!-- Paper -->

    <section class="card">

        <h3>Paper Size</h3>

        <div class="option active">
            A4 Sheet
        </div>

    </section>

    <!-- Print Type -->

    <section class="card">

        <h3>Print Type</h3>

        <label class="radio">

            <input type="radio"
                   name="type"
                   checked>

            Black & White

        </label>

        <label class="radio">

            <input type="radio"
                   name="type">

            Colour

        </label>

    </section>

    <!-- Side -->

    <section class="card">

        <h3>Print Side</h3>

        <label class="radio">

            <input type="radio"
                   name="side"
                   checked>

            Single Side

        </label>

        <label class="radio">

            <input type="radio"
                   name="side">

            Double Side

        </label>

    </section>

    <!-- Copies -->

    <section class="card">

        <h3>Copies</h3>

        <div class="qty">

            <button>-</button>

            <span>1</span>

            <button>+</button>

        </div>

    </section>

    <!-- Price -->

    <section class="card total-card">

        <div>

            <h3>Total</h3>

            <p>Estimated Price</p>

        </div>

        <h2>₹5</h2>

    </section>

</main>

<footer class="bottom">

    <button class="order-btn">

        <i class="ri-shopping-cart-line"></i>

        Add to Cart

    </button>

</footer>

<script src="assets/js/print.js"></script>

</body>

</html>
