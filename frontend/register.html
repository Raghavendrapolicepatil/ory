<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register | Orymart</title>

<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/login.css">

<link
    href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css"
    rel="stylesheet">

</head>

<body>

<div class="app">

<div class="login-container">

<div class="login-logo">

<img
    src="assets/icons/icon-512.png"
    alt="Orymart">

<h1>Create Account</h1>

<p>Join Orymart and start shopping</p>

</div>


<form id="registerForm">

<!-- ==========================================
     Name
========================================== -->

<div class="input-box">

<i class="ri-user-line"></i>

<input
    type="text"
    id="name"
    placeholder="Full Name"
    autocomplete="name"
    required>

</div>


<!-- ==========================================
     Phone
========================================== -->

<div class="input-box">

<i class="ri-phone-line"></i>

<input
    type="tel"
    id="phone"
    placeholder="Mobile Number"
    maxlength="10"
    inputmode="numeric"
    autocomplete="tel"
    required>

</div>


<!-- ==========================================
     Send OTP
========================================== -->

<button
    type="submit"
    class="login-btn"
    id="sendOtpBtn">

Send OTP

</button>


<!-- ==========================================
     OTP Section
========================================== -->

<div
    id="otpSection"
    style="display:none;">

<div class="input-box">

<i class="ri-shield-keyhole-line"></i>

<input
    type="text"
    id="otp"
    placeholder="Enter OTP"
    maxlength="4"
    inputmode="numeric"
    autocomplete="one-time-code">

</div>


<button
    type="button"
    class="login-btn"
    id="verifyOtpBtn">

Verify OTP

</button>

</div>

</form>


<!-- ==========================================
     Login Link
========================================== -->

<div class="login-links">

<p>

Already have an account?

<a href="login.html">
    Login
</a>

</p>

</div>

</div>

</div>


<script src="assets/js/register.js"></script>
<script src="assets/js/theme.js"></script>

</body>

</html>
